function go(page){state.page=page;save('faPage',page);render();window.scrollTo({top:0,behavior:'smooth'})}
function header(){return `<header class="topbar"><div class="wrap nav"><div class="brand" onclick="go('feed')"><span class="mark">F</span>폼앗이</div><nav class="navlinks"><button class="${state.page==='feed'?'active':''}" onclick="go('feed')">모집 중 설문</button><button class="${state.page==='archive'?'active':''}" onclick="go('archive')">결과 아카이브</button><button class="${state.page==='mine'?'active':''}" onclick="go('mine')">내 설문 관리</button></nav><div class="navright"><span class="credit">✦ <b>${fmt(state.credit)}</b> C</span><button class="primary register-top" onclick="go('register')">＋ 설문 등록하기</button><button class="avatar" title="프로필 설정" onclick="go('profile')">${(state.profile.nickname||'민').slice(0,1)}</button></div></div></header>`}
function surveyCard(s,i){let pct=Math.min(100,Math.round(s.done/s.total*100));return `<article class="card"><div class="cardtop"><span class="tag ${i===5?'purple':''}">${s.tag}</span><span class="micro">${s.days}</span></div><h3>${esc(s.title)}</h3><div class="meta"><span>◉ ${esc(s.target)}</span><span>◷ 약 ${s.time}분</span><span>▣ ${esc(s.type)}</span></div><div class="progressrow"><span>${fmt(s.done)} / ${fmt(s.total)}명 참여</span><b>${pct}%</b></div><div class="track"><i style="width:${pct}%"></i></div><div class="cardfoot"><span class="reward">＋10 C</span><button class="primary" onclick="participateByTitle('${esc(s.title)}')">응답하고 10C 받기 →</button></div></article>`}
function feed(){let list=[...state.mySurveys,...samples];list=list.filter(s=>state.filter.job==='전체'||s.target?.includes(state.filter.job)||state.filter.job==='대학생'&&s.target?.includes('학생'));list=list.filter(s=>state.filter.region==='전체'||s.target?.includes(state.filter.region)||s.target?.includes('수도권'));if(state.search)list=list.filter(s=>(s.title+s.target).toLowerCase().includes(state.search.toLowerCase()));if(state.sort==='마감 임박순')list.reverse();return `<main class="wrap main"><section class="hero"><div><span class="eyebrow">✦ 신뢰 기반 상호 설문 플랫폼</span><h1>필요한 타겟에게 설문을 연결하고,<br>성실한 응답으로 크레딧을 모아보세요.</h1><p>설문에 답하면 10C, 내 설문을 원하는 응답자에게 배포할 수 있어요. 결과를 공유하면 크레딧이 다시 쌓입니다.</p><div class="hero-actions"><button class="primary" onclick="go('register')">내 설문 배포하기 <b>→</b></button><button class="secondary" onclick="go('archive')">결과 아카이브 둘러보기</button></div></div><div class="stats"><div class="stat"><small>내 보유 크레딧</small><strong class="violet">${fmt(state.credit)} C</strong><span>응답 보상으로 더 모으기</span></div><div class="stat"><small>응답 1건 보상</small><strong>＋10 C</strong><span>확인 후 바로 적립</span></div><div class="stat"><small>모집 중인 설문</small><strong>18건</strong><span>내 프로필에 맞는 설문</span></div><div class="stat"><small>평균 응답 시간</small><strong>2.8분</strong><span>간편하게 참여해요</span></div></div></section><section class="section"><div class="tabsline"><div class="tabset"><button class="on" onclick="go('feed')">모집 중 설문 <span class="micro">${list.length}</span></button><button onclick="go('archive')">결과 아카이브 <span class="micro">42</span></button></div><span class="micro">✓ 내 프로필: ${state.profile.age} · ${state.profile.job} · ${state.profile.region}</span></div><div class="filterbar"><span class="filter-label">직업</span>${chips(['전체','대학생','직장인','취업준비생'],'job')}<span class="filter-label">지역</span>${chips(['전체','서울','경기도','인천'],'region')}<input class="select" placeholder="키워드 검색" value="${state.search}" oninput="state.search=this.value;render()"></div><div class="grid">${list.length?list.map(s=>surveyCard(s,samples.indexOf(s))).join(''):`<div class="empty">조건에 맞는 설문이 없어요.<br><button class="secondary" style="margin-top:12px" onclick="resetFilters()">필터 초기화</button></div>`}</div><div class="trust">🛡️ <b>폼앗이 응답 확인 시스템</b> · 외부 설문 참여 후 돌아와 완료 확인을 누르면 크레딧이 적립됩니다. 응답 시간은 데모용으로 간단히 확인합니다.</div></section></main>`}
function chips(options,key){return options.map(o=>`<button class="chip ${state.filter[key]===o?'selected':''}" onclick="state.filter.${key}='${o}';render()">${o}</button>`).join('')}
function resetFilters(){state.filter={job:'전체',region:'전체',age:'전체',category:'전체'};state.search='';render()}
function archive(){let list=archives.filter(a=>(state.filter.category==='전체'||a.cat===state.filter.category)&&(!state.search||(a.title+a.target+a.cat).toLowerCase().includes(state.search.toLowerCase())));if(state.sort==='표본 수 많은순')list.sort((a,b)=>parseInt(b.target.match(/\d+/)[0])-parseInt(a.target.match(/\d+/)[0]));if(state.sort==='최신 마감순')list.reverse();return `<main class="wrap main"><div class="archive-banner"><div><strong>🔁 크레딧 선순환 · 신뢰 기반 지식 공유 아카이브</strong><p>결과를 열람하면 원작성자에게 5C가 적립돼요. 내 결과도 공유해 꾸준히 크레딧을 모아보세요.</p></div><div class="archive-income">내 아카이브 수익 <b>＋${fmt(get('faEarned',45))} C</b></div></div><div class="intro"><div><span class="eyebrow">● RESEARCH INTELLIGENCE DATABASE</span><h1>선행 리서치 결과 데이터 둘러보기</h1><p>마감된 설문 결과를 참고해 학위 논문과 사업 아이디어에 활용해 보세요.</p></div></div><div class="archive-stats"><div>공개 아카이브<b>42건</b></div><div>누적 응답 표본<b class="purple-num">3,490명</b></div><div>환원된 크레딧<b style="color:var(--green)">17,450 C</b></div></div><div class="tabsline"><div class="tabset"><button onclick="go('feed')">모집 중 설문 18건</button><button class="on">결과 아카이브 42건</button></div><span class="micro">✓ 검토 완료된 리서치 데이터</span></div><div class="searchrow"><input placeholder="키워드로 과거 결과 검색 (예: 직장인 출퇴근)" value="${state.search}" oninput="state.search=this.value;render()"><button class="primary" onclick="render()">검색</button><select class="select" onchange="state.sort=this.value;render()"><option>인기순</option><option ${state.sort==='최신 마감순'?'selected':''}>최신 마감순</option><option ${state.sort==='표본 수 많은순'?'selected':''}>표본 수 많은순</option></select></div><div class="filterbar" style="padding-top:0">${chips(['전체','경영/마케팅','사회/공공','소비/라이프스타일','IT/테크','교육/학습'],'category')}</div><div class="grid">${list.map((a,i)=>`<article class="card archive-card"><div class="cardtop"><span class="tag purple">${i===0?'추천 데이터':a.cat}</span><span class="micro">👁 ${a.views}회</span></div><h3>${a.title}</h3><div class="meta"><span>◉ ${a.target}</span><span>▣ ${a.format}</span></div><div class="insight">✦ 핵심 인사이트　${a.insight}</div><div class="cardfoot"><span class="reward" style="color:var(--purple);background:var(--purplep)">열람 5 C</span><button class="purple-btn" onclick="unlock(${i})">🔒 5C로 결과 보기</button></div></article>`).join('')}</div><div class="trust">📚 데모 아카이브의 주제·표본 수·인사이트는 화면 예시 데이터입니다. 실제 결과 링크는 등록자 연결이 필요합니다.</div></main>`}
function register(){let count=Number(document.getElementById('sampleCount')?.value||50),cost=count*10,remaining=state.credit-cost,form=state.draft||{};return `<main class="wrap main"><div class="intro"><div><span class="eyebrow">● 빠른 표본 수집 엔진</span><h1>새 설문 등록하기</h1><p>외부 설문 링크를 붙여넣고, 원하는 응답자 조건을 설정해요.</p></div><div class="credit">내 보유 크레딧　${fmt(state.credit)} C</div></div><div class="steps"><div class="step on">✓　1 링크와 기본 정보</div><div class="step on">②　2 타겟과 표본 설정</div><div class="step">3　크레딧 정산 및 배포</div></div><div class="formlayout"><section><div class="panel"><h2>설문 기본 정보</h2><p class="sub">모집할 설문에 대한 정보를 입력해 주세요.</p><div class="field"><label>설문 제목 <span id="titleCount">${(form.title||'').length} / 40</span></label><input id="title" maxlength="40" placeholder="예: 직장인의 출퇴근 패턴 조사" value="${esc(form.title||'')}" oninput="state.draft={...state.draft,title:this.value};document.getElementById('titleCount').textContent=this.value.length+' / 40';updateQuote()"></div><div class="field"><label>외부 설문 링크</label><input id="surveyUrl" type="url" placeholder="https://forms.gle/..." value="${esc(form.url||'')}" oninput="state.draft={...state.draft,url:this.value};updateQuote()"><div class="hint">Google Forms 또는 Naver Forms 공유 링크를 입력하세요.</div></div><div class="field"><label>예상 소요 시간</label><div class="choice-row">${[1,3,5,10].map(t=>`<button class="choice ${state.surveyTime===t?'active':''}" onclick="state.surveyTime=${t};render()">${t===10?'10분 이상':`약 ${t}분`}</button>`).join('')}</div></div></div><div class="panel"><h2>타겟 응답자 조건</h2><p class="sub">설문 대상에 해당하는 조건을 선택해 주세요.</p><div class="field"><label>직업군 · 복수 선택</label><div class="choice-row">${choiceChecks(['직장인','대학생','자영업','프리랜서','취업준비생','주부','기타'],'job')}</div></div><div class="field"><label>연령대 · 복수 선택</label><div class="choice-row">${choiceChecks(['10대','20대','30대','40대','50대 이상'],'age')}</div></div><div class="field"><label>지역 · 복수 선택</label><div class="choice-row">${choiceChecks(['서울','경기도','인천','충청','영남','호남'],'region')}</div><div class="matchbox"><span>◉ 현재 조건에 맞는 패널<br><small>선택한 조건을 기반으로 예상합니다</small></span><b>약 480명</b></div></div><div class="field"><label>목표 표본 수 <b><span id="countLabel">${count}</span>명</b></label><input class="range" id="sampleCount" type="range" min="10" max="300" step="10" value="${count}" oninput="document.getElementById('countLabel').textContent=this.value;updateQuote()"><div class="hint">10명　　100명　　200명　　300명</div><div class="tip">ℹ 일반적인 학술 연구는 30~100명, 제품 검증은 50명 이상을 권장해요.</div></div></div></section><aside class="sticky"><div class="panel"><span class="tag purple">1인당 10 C</span><h2 style="margin-top:13px">실시간 배포 견적</h2><div class="total"><span>목표 표본 수</span><b id="quoteCount">${count}명</b></div><div class="total"><span>응답 리워드 단가</span><b>10 C / 명</b></div><div class="total"><span>타겟팅 추가 수수료</span><b>0 C</b></div><div class="total big"><span>총 필요 크레딧</span><b id="quoteCost">${fmt(cost)} C</b></div><div class="balance"><span>현재 보유</span><b>${fmt(state.credit)} C</b></div><div class="balance"><span>배포 후 잔액</span><b id="quoteRemaining">${fmt(remaining)} C</b></div><div id="quoteStatus" class="ok ${remaining<0?'warning':''}">${remaining<0?'크레딧이 부족해요':'✓ 배포 가능 상태입니다'}</div><button class="primary full" onclick="publish()">크레딧 차감하고 배포 요청 🚀</button><div class="hint">미달성 표본에 해당하는 크레딧은 자동 반환돼요.</div><div class="rewardbox"><b>✦ 선순환 크레딧 리워드</b>모집 마감 후 결과 링크를 등록하면 다른 연구자가 열람할 때마다 5C씩 적립돼요.</div></div></aside></div></main>`}
function choiceChecks(options,key){let chosen=state.draft?.[key]||({job:['직장인'],age:['20대','30대'],region:['경기도']}[key]);return options.map(o=>`<button class="choice ${chosen.includes(o)?'active':''}" onclick="toggleChoice('${key}','${o}')">${o}</button>`).join('')}
function toggleChoice(key,value){let d=state.draft||{};d[key]=d[key]||({job:['직장인'],age:['20대','30대'],region:['경기도']}[key]);d[key]=d[key].includes(value)?d[key].filter(x=>x!==value):[...d[key],value];state.draft=d;render()}
function updateQuote(){let n=Number(document.getElementById('sampleCount')?.value||50),cost=n*10,r=state.credit-cost;document.getElementById('quoteCount').textContent=n+'명';document.getElementById('quoteCost').textContent=fmt(cost)+' C';document.getElementById('quoteRemaining').textContent=fmt(r)+' C';let el=document.getElementById('quoteStatus');el.textContent=r<0?'크레딧이 부족해요':'✓ 배포 가능 상태입니다';el.classList.toggle('warning',r<0)}
function publish(){let title=document.getElementById('title').value.trim(),url=document.getElementById('surveyUrl').value.trim(),count=Number(document.getElementById('sampleCount').value);if(title.length<5){toast('설문 제목은 5자 이상 입력해 주세요.');return}if(!isValidLink(url)){toast('https://로 시작하는 설문 링크를 입력해 주세요.');return}if(state.credit<count*10){modal('크레딧이 부족해요',`이 설문을 배포하려면 ${fmt(count*10)}C가 필요해요. 설문에 참여해 크레딧을 모아보세요.`,()=>go('feed'),'설문 둘러보기');return}modal('설문을 배포할까요?',`${fmt(count*10)}C를 사용해 ${count}명의 응답자를 모집합니다.`,()=>{state.credit-=count*10;let surveys=get('faSurveys',[]);surveys.unshift({title,target:[...(state.draft?.job||[]),...(state.draft?.region||[])].join(' · ')||'전체 응답자',time:state.surveyTime,done:0,total:count,tag:'내 설문',type:'외부 설문',days:'모집 중',url});save('faCredit',state.credit);save('faSurveys',surveys);state.draft={};toast('설문이 등록됐어요. 응답이 모이면 알려드릴게요.');go('mine')},'배포 요청')}
function unlock(i){let a=archives[i],key='a'+i,claimed=get('faClaimed',[]);if(claimed.includes(key)){window.open('https://docs.google.com/spreadsheets/','_blank','noopener');toast('이전에 열람한 결과예요. 다시 열어드립니다.');return}if(state.credit<5){modal('크레딧이 부족해요','결과 열람에는 5C가 필요해요. 모집 중인 설문에 참여해 크레딧을 모아보세요.',()=>go('feed'),'설문 참여하기');return}modal('결과를 열람할까요?',`5C가 차감되고 작성자에게 5C가 적립돼요. ${a.target}의 결과 자료를 확인할 수 있습니다.`,()=>{state.credit-=5;claimed.push(key);save('faCredit',state.credit);save('faClaimed',claimed);save('faEarned',get('faEarned',45)+5);render();toast('결과 열람 권한을 저장했어요. (데모 자료)')},'5C로 열람')}
function participateByTitle(title){let s=[...get('faSurveys',[]),...samples].find(x=>x.title===title);if(!s){toast('설문 정보를 찾지 못했어요.');return}let url=s.url||'';modal('설문에 참여할까요?',`외부 설문 링크를 새 창에서 열고 완료 후 돌아와 확인을 누르면 10C를 적립해요.${url?'':' 이 예시 설문은 연결된 외부 링크가 없습니다.'}`,()=>{if(url)window.open(url,'_blank','noopener');save('faPending',{title:s.title,started:Date.now()});modal('응답을 마쳤나요?','성실한 참여를 확인하기 위해 약 20초 이상 참여한 뒤 완료를 눌러 주세요.',()=>completeSurvey(),'응답 완료 확인')},url?'설문 열기':'확인하기')}
function completeSurvey(){let pending=get('faPending',null);if(!pending){toast('진행 중인 설문이 없습니다.');return}if(Date.now()-pending.started<8000){toast('설문에 참여한 뒤 잠시 후 다시 확인해 주세요.');return}state.credit+=10;save('faCredit',state.credit);localStorage.removeItem('faPending');toast('응답이 확인되어 10C가 적립됐어요!');render()}
function mine(){let list=get('faSurveys',[]);return `<main class="wrap main"><div class="intro"><div><span class="eyebrow">MY RESEARCH</span><h1>내 설문 관리</h1><p>등록한 설문의 모집 현황과 결과 링크를 관리해요.</p></div><button class="primary" onclick="go('register')">＋ 설문 등록하기</button></div><div class="panel"><h2>모집 중인 설문 <span class="tag">${list.length}건</span></h2><p class="sub">현재 크레딧 잔액 ${fmt(state.credit)} C</p>${list.length?list.map((s,i)=>`<div class="card" style="min-height:0;margin:12px 0"><div class="cardtop"><span class="tag">모집 중</span><span class="micro">${s.total}명 목표</span></div><h3>${s.title}</h3><div class="meta">대상 ${s.target} · 응답 ${s.done}/${s.total}명</div><div class="cardfoot"><span class="micro">${s.url}</span><button class="secondary" onclick="modal('결과 링크 등록','모집이 마감된 뒤 결과 요약 링크를 추가하면 아카이브에 공유할 수 있어요.',()=>toast('데모 화면에서는 링크 입력 기능을 준비 중이에요.'),'확인')">결과 링크 등록</button></div></div>`).join(''):`<div class="empty">아직 등록한 설문이 없어요.<br><button class="primary" style="margin-top:14px" onclick="go('register')">첫 설문 등록하기</button></div>`}</div><div class="panel"><h2>최근 크레딧 내역</h2><div class="total"><span>설문 결과 열람 보상</span><b style="color:var(--green)">+5 C</b></div><div class="total"><span>설문 응답 보상</span><b style="color:var(--green)">+10 C</b></div></div></main>`}
function profile(){let p=state.profile;return `<main class="wrap main"><section class="onboard"><div class="onboard-head"><span class="eyebrow">🛡 신뢰 기반 상호 교환 리서치</span><h1>폼앗이에 오신 걸 환영해요</h1><p class="micro">내게 맞는 설문을 연결할 수 있도록 간단한 프로필을 설정해 주세요.</p></div><div class="onboard-grid"><div class="panel"><span class="tag">⚡ STEP 1</span><h2 style="margin-top:14px">원클릭으로 시작하기</h2><p class="sub">소셜 계정 연동은 이 프로토타입에서 시뮬레이션됩니다.</p><div class="social"><button class="kakao" onclick="toast('데모에서는 실제 카카오 로그인에 연결되지 않습니다.')">●　카카오로 시작하기</button><button class="google" onclick="toast('데모에서는 실제 Google 로그인에 연결되지 않습니다.')">G　Google 계정으로 계속하기</button></div><div class="softnote">가입 웰컴 크레딧 10C 자동 적립 · 데모에서는 저장 시 최초 1회만 지급됩니다.</div></div><div class="panel"><span class="tag purple">STEP 2 · 15초 설정</span><h2 style="margin-top:14px">딱 3가지만 알려주세요</h2><div class="field"><label>활동 닉네임</label><input id="nickname" maxlength="10" minlength="2" value="${esc(p.nickname||'')}"></div><div class="field"><label>직업 구분</label><select id="job">${['대학생','직장인','취업준비생','자영업','기타'].map(x=>`<option ${p.job===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>거주 지역</label><select id="region">${['서울','경기도','인천','기타'].map(x=>`<option ${p.region===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>연령대</label><select id="age">${['10대','20대','30대','40대+'].map(x=>`<option ${p.age===x?'selected':''}>${x}</option>`)}</select></div><button class="primary full" onclick="saveProfile()">저장하고 시작하기 →</button></div></div></section></main>`}
function saveProfile(){let nickname=document.getElementById('nickname').value.trim();if(nickname.length<2||nickname.length>10||/\s/.test(nickname)){toast('닉네임은 공백 없이 2~10자로 입력해 주세요.');return}let first=!get('faWelcomed',false);state.profile={nickname,job:document.getElementById('job').value,region:document.getElementById('region').value,age:document.getElementById('age').value};if(first){state.credit+=10;save('faWelcomed',true);save('faCredit',state.credit)}save('faProfile',state.profile);toast(first?'환영해요! 10C를 적립했어요.':'프로필을 저장했어요.');go('feed')}
function modal(title,body,action,label='확인'){document.getElementById('overlay').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><p>${body}</p><div class="modal-actions"><button class="ghost" onclick="closeModal()">취소</button><button class="primary" id="modalGo">${label}</button></div></div></div>`;document.getElementById('modalGo').onclick=()=>{closeModal();action?.()}}
function closeModal(){document.getElementById('overlay').innerHTML=''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let content=state.page==='archive'?archive():state.page==='register'?register():state.page==='mine'?mine():state.page==='profile'?profile():feed();document.getElementById('app').innerHTML=(state.page==='profile'?'':header())+content+(state.page==='profile'?'':`<footer class="footer">폼앗이 · 서로의 리서치를 돕는 설문 품앗이 플랫폼<br><span>현재 화면은 PRD 및 Stitch 디자인 명세를 바탕으로 만든 로컬 데모이며 데이터는 이 브라우저에 저장됩니다.</span></footer>`)}
render();
</script></body></html>
